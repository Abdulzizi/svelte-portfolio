<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				var s = localStorage.getItem('aj-theme');
				var t = (s === 'light' || s === 'dark') ? s : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
				document.documentElement.dataset.theme = t;
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
			}
		</script>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Abdul Jawad Azizi" />
		<meta property="og:title" content="Abdul Jawad Azizi — Full Stack Developer" />
		<meta property="og:description" content="Abdul Jawad Azizi, full stack developer. Work, contact, about and blog." />
		<meta name="twitter:card" content="summary" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
