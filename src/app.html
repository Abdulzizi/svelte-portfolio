<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				var s = localStorage.getItem('aj-theme');
				var t = (s === 'light' || s === 'dark') ? s : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
				document.documentElement.dataset.theme = t;
				var off = localStorage.getItem('aj-motion') === 'off';
				if (off) document.documentElement.dataset.motion = 'off';
				if (!off && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
			}
		</script>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta property="og:site_name" content="Abdul Jawad Azizi" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
